apiVersion: apps/v1
kind: Deployment
metadata:
  name: educlinic-backend
  labels:
    app: educlinic-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: educlinic-backend
  template:
    metadata:
      labels:
        app: educlinic-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/alumniconnect4/educlinic-backend:latest
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: educlinic-backend-svc
spec:
  selector:
    app: educlinic-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
