# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name api.h4x.co.in;

    return 301 https://$host:2087$request_uri;
}

# HTTPS Reverse Proxy
server {
    listen 2087 ssl http2;
    listen [::]:2087 ssl http2;

    server_name api.h4x.co.in;

    # Allow request bodies up to 100 MB & buffer sizes
    client_max_body_size 100M;
    client_body_buffer_size 100M;

    # Increase timeout settings for large file uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    ssl_certificate     /etc/letsencrypt/live/api.h4x.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.h4x.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        client_max_body_size 100M;
        proxy_pass http://192.168.49.2:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    location /argocd/ {
        proxy_pass http://192.168.49.2:31068/argocd/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}